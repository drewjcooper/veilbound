name: Publish Veilbound

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: |
            index.html
            styles.css
            app.js
            game.js
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
